services:
  catshi-api:
    image: ghcr.io/ktrieu/catshi-api:${CATSHI_IMAGE_TAG:?CATSHI_IMAGE_TAG must be set}
    build: !reset null
    restart: unless-stopped
    ports:
      - "${API_PORT}:${API_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - POSTGRES_URL=${POSTGRES_URL}

  catshi-bot:
    image: ghcr.io/ktrieu/catshi-bot:${CATSHI_IMAGE_TAG:?CATSHI_IMAGE_TAG must be set}
    build: !reset null
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.daily-digest.schedule: "0 0 9 * * *"
      ofelia.job-exec.daily-digest.command: "bot daily_digest"

  catshi-purser:
    image: ghcr.io/ktrieu/catshi-purser:${CATSHI_IMAGE_TAG:?CATSHI_IMAGE_TAG must be set}
    build: !reset null
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - POSTGRES_URL=${POSTGRES_URL}

  catshi-migrate:
    image: ghcr.io/ktrieu/catshi-migrate:${CATSHI_IMAGE_TAG:?CATSHI_IMAGE_TAG must be set}
    build: !reset null
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${POSTGRES_URL}

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: "catshi-ofelia"
    restart: unless-stopped
    depends_on:
      - catshi-bot
    environment:
      - TZ=America/Toronto
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: daemon --docker

networks:
  default:
    name: ${DOCKER_NETWORK:?DOCKER_NETWORK must be set}
    external: true
