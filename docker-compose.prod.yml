services:
  catshi-api:
    build:
      target: prod
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${PROD_SQLITE_DIR}:/app/db
    environment:
      - POSTGRES_URL=${POSTGRES_URL}

  catshi-bot:
    build:
      target: prod
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${PROD_SQLITE_DIR}:/app/db
    environment:
      - POSTGRES_URL=${POSTGRES_URL}

  catshi-migrate:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${POSTGRES_URL}
