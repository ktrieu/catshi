services:
  catshi-api:
    image: ghcr.io/ktrieu/catshi-api:${CATSHI_IMAGE_TAG:?CATSHI_IMAGE_TAG must be set}
    build: !reset null
    restart: unless-stopped
    ports:
      - "${API_PORT}:${API_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - POSTGRES_URL=${POSTGRES_URL}

  catshi-bot:
    image: ghcr.io/ktrieu/catshi-bot:${CATSHI_IMAGE_TAG:?CATSHI_IMAGE_TAG must be set}
    build: !reset null
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}

  catshi-purser:
    image: ghcr.io/ktrieu/catshi-purser:${CATSHI_IMAGE_TAG:?CATSHI_IMAGE_TAG must be set}
    build: !reset null
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - POSTGRES_URL=${POSTGRES_URL}

  catshi-migrate:
    image: ghcr.io/ktrieu/catshi-migrate:${CATSHI_IMAGE_TAG:?CATSHI_IMAGE_TAG must be set}
    build: !reset null
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${POSTGRES_URL}
