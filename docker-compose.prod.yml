services:
  catshi-api:
    build:
      target: prod
    restart: unless-stopped
    volumes:
      - ${PROD_SQLITE_DIR}:/app/db
    environment:
      - POSTGRES_URL=${POSTGRES_URL}

  catshi-bot:
    build:
      target: prod
    restart: unless-stopped
    volumes:
      - ${PROD_SQLITE_DIR}:/app/db
    environment:
      - POSTGRES_URL=${POSTGRES_URL}

  catshi-migrate:
    environment:
      - DATABASE_URL=${POSTGRES_URL}
