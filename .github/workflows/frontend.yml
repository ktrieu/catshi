name: Build frontend

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  # Don't cancel master runs mid-release; PR builds can be superseded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KEEP_RELEASES: 10

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Package dist
        run: |
          echo "$GITHUB_SHA" > dist/VERSION
          tar -czf frontend.tar.gz -C dist .

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="frontend-${GITHUB_SHA::7}"
          gh release create "$tag" frontend.tar.gz \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$tag" \
            --notes "Frontend build of $GITHUB_SHA"

      - name: Prune old releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh lists newest first; drop everything past the newest $KEEP_RELEASES.
          gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | grep '^frontend-' \
            | tail -n +$((KEEP_RELEASES + 1)) \
            | xargs -r -n1 gh release delete --cleanup-tag --yes
