services:
  # Bind-mount the workspace's source dirs and manifests directly (not the
  # whole repo root) so the container's own target/ dir - built inside the
  # container by cargo-watch - is never shadowed by whatever's in the
  # host's target/ (which may hold incompatible Windows build artifacts).
  catshi-api:
    build:
      target: dev
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_URL=postgres://catshi:catshi@postgres:5432/catshi
      - SQLX_OFFLINE=true
    volumes:
      - ./api:/app/api
      - ./bot:/app/bot
      - ./common:/app/common
      - ./Cargo.toml:/app/Cargo.toml
      - ./Cargo.lock:/app/Cargo.lock
      - ./db:/app/db/
      # Cache Cargo build directories in a volume so the build doesn't take forever.
      - cargo-registry-api:/usr/local/cargo/registry
      - cargo-git-api:/usr/local/cargo/git
      - target-api:/app/target

  catshi-bot:
    build:
      target: dev
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_URL=postgres://catshi:catshi@postgres:5432/catshi
      - SQLX_OFFLINE=true
    volumes:
      - ./api:/app/api
      - ./bot:/app/bot
      - ./common:/app/common
      - ./Cargo.toml:/app/Cargo.toml
      - ./Cargo.lock:/app/Cargo.lock
      - ./db:/app/db/
      - cargo-registry-bot:/usr/local/cargo/registry
      - cargo-git-bot:/usr/local/cargo/git
      - target-bot:/app/target

  catshi-migrate:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://catshi:catshi@postgres:5432/catshi

  postgres:
    image: postgres:16-alpine
    container_name: "catshi-postgres"
    environment:
      - POSTGRES_USER=catshi
      - POSTGRES_PASSWORD=catshi
      - POSTGRES_DB=catshi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catshi -d catshi"]
      interval: 2s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    environment:
      - FRONTEND_PORT=${FRONTEND_PORT}
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres-data:
  cargo-registry-api:
  cargo-git-api:
  target-api:
  cargo-registry-bot:
  cargo-git-bot:
  target-bot:
