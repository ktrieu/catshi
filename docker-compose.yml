services:
  catshi-api:
    container_name: "catshi-api"
    build:
      context: .
      dockerfile: api/Dockerfile
    init: true
    depends_on:
      catshi-migrate:
        condition: service_completed_successfully
    environment:
      - API_PORT=${API_PORT}
      - GUILD_ID=${GUILD_ID}
      - DISCORD_TOKEN=${DISCORD_TOKEN}

  catshi-bot:
    container_name: "catshi-bot"
    build:
      context: .
      dockerfile: bot/Dockerfile
    init: true
    depends_on:
      catshi-migrate:
        condition: service_completed_successfully
    environment:
      - GUILD_ID=${GUILD_ID}
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}

  catshi-cf-archiver:
    container_name: "catshi-cf-archiver"
    build:
      context: .
      dockerfile: cf-archiver/Dockerfile
    init: true
    depends_on:
      catshi-migrate:
        condition: service_completed_successfully
    environment:
      - DISCORD_TOKEN=${CF_ARCHIVER_DISCORD_TOKEN}
      - CF_ARCHIVE_CHANNEL_ID=${CF_ARCHIVE_CHANNEL_ID}

  catshi-migrate:
    container_name: "catshi-migrate"
    build:
      context: .
      dockerfile: Dockerfile.migrate
